<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proposer un modèle · Mèmetropole</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="favicon.svg" alt="" width="32" height="32"><span>Mèmetropole</span></a>
    <div class="topbar-right"><button class="icon-btn" id="theme-toggle" type="button" aria-label="Changer de thème"></button></div>
  </header>
  <main>
    <div class="page-head">
      <h1>Proposer un modèle</h1>
      <p>Tu as repéré un mème qui tourne partout ? Envoie le modèle vierge (sans texte). Il sera vérifié avant d'arriver dans le jeu.</p>
    </div>

    <form class="card form-card" id="form">
      <label class="field"><span>Nom du modèle</span>
        <input name="title" maxlength="80" required placeholder="Ex. : Le chat qui juge">
      </label>
      <label class="field"><span>Ton pseudo</span>
        <input name="name" maxlength="24" placeholder="Facultatif">
      </label>
      <label class="field"><span>Fichier (JPG, PNG, GIF, WebP, MP4 ou WebM, 15 Mo max)</span>
        <input name="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm">
      </label>
      <div class="divider"><span>ou</span></div>
      <label class="field"><span>Lien YouTube, ou lien direct vers une image ou une vidéo</span>
        <input name="url" type="url" inputmode="url" placeholder="https://www.youtube.com/shorts/…">
      </label>
      <label class="field"><span>Nombre de zones de texte (images)</span>
        <select name="boxCount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
      </label>
      <p class="notice">N'envoie que du contenu que tu as le droit de partager. Pas de contenu choquant, haineux ou
        visant une personne privée : ce sera refusé.</p>
      <button class="btn btn-primary btn-lg" type="submit">Envoyer pour validation</button>
      <p class="error" id="error" role="alert"></p>
      <p class="hint" id="ok" role="status"></p>
    </form>
  </main>
  <script type="module">
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    const ok = document.getElementById('ok');
    try { form.elements.name.value =localStorage.getItem('memetropole-name') ?? ''; } catch { /* ignoré */ }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = ok.textContent = '';
      const data = new FormData(form);
      if (!form.file.files.length) data.delete('file');
      if (!data.has('file') && !form.url.value.trim()) { err.textContent = 'Ajoute un fichier ou un lien.'; return; }
      const btn = form.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/submissions', { method: 'POST', body: data });
        if (res.status === 429) throw new Error('Trop de propositions d\'affilée. Réessaie dans quelques minutes.');
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || 'Envoi impossible.');
        form.reset();
        ok.textContent = 'Merci ! Ta proposition sera vérifiée avant d\'apparaître dans le jeu.';
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
